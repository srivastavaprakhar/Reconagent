[project]
name = "reconagent"
version = "0.1.0"
description = "Cross-border-aware three-way settlement reconciliation engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["reconagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
