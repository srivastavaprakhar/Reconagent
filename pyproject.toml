[project]
name = "reconagent"
version = "0.1.0"
description = "Cross-border-aware three-way settlement reconciliation engine"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "splink>=4.0.17",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "faiss-cpu>=1.8",
    "tigerbeetle>=0.17.9",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["reconagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
